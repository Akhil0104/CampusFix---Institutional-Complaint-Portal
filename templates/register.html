{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 p-4">
                <div class="card-header bg-transparent border-0 text-center pb-3 pt-2">
                    <h3 class="fw-bold mb-1 text-light">
                        <i class="bi bi-person-plus text-primary me-2"></i> 
                        Create Account
                    </h3>
                    <p class="text-muted small mb-0">Join CampusFix to submit and track institutional reports</p>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label text-light">Username *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       value="{{ form_data.username if form_data else '' }}"
                                       placeholder="Choose a username"
                                       minlength="3"
                                       required>
                                <small class="text-muted" style="font-size: 0.75rem;">Minimum 3 characters</small>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label text-light">Email Address *</label>
                                <input type="email" 
                                       class="form-control" 
                                       id="email" 
                                       name="email" 
                                       value="{{ form_data.email if form_data else '' }}"
                                       placeholder="email@example.com"
                                       required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label text-light">Password *</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password" 
                                       placeholder="Minimum 6 characters"
                                       minlength="6"
                                       required>
                                <small class="text-muted" style="font-size: 0.75rem;">Minimum 6 characters</small>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="confirm_password" class="form-label text-light">Confirm Password *</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="confirm_password" 
                                       name="confirm_password" 
                                       placeholder="Retype password"
                                       required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label text-light">Register as *</label>
                                <select class="form-select text-light" id="role" name="role" required>
                                    <option value="student" selected>Student</option>
                                    <option value="staff">Staff Member</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="department" class="form-label text-light">Department</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="department" 
                                       name="department" 
                                       value="{{ form_data.department if form_data else '' }}"
                                       placeholder="e.g., Computer Science">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3" id="roll_number_field">
                                <label for="roll_number" class="form-label text-light">Roll Number *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="roll_number" 
                                       name="roll_number" 
                                       value="{{ form_data.roll_number if form_data else '' }}"
                                       placeholder="Enter your roll number"
                                       required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label text-light">Phone Number</label>
                                <input type="tel" 
                                       class="form-control" 
                                       id="phone" 
                                       name="phone" 
                                       value="{{ form_data.phone if form_data else '' }}"
                                       placeholder="Enter your phone number">
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary py-2.5">
                                <i class="bi bi-person-plus me-1"></i> Register Account
                            </button>
                        </div>
                    </form>
                    
                    <hr class="my-4 border-white-10">
                    
                    <div class="text-center">
                        <p class="text-muted small">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Show/hide roll number field based on role selection
document.getElementById('role').addEventListener('change', function() {
    const rollNumberField = document.getElementById('roll_number_field');
    const rollNumberInput = document.getElementById('roll_number');
    if (this.value === 'student') {
        rollNumberField.style.display = 'block';
        rollNumberInput.required = true;
    } else {
        rollNumberField.style.display = 'none';
        rollNumberInput.required = false;
        rollNumberInput.value = '';
    }
});

// Password match validation
document.getElementById('confirm_password').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const confirm = this.value;
    
    if (password !== confirm) {
        this.setCustomValidity('Passwords do not match');
    } else {
        this.setCustomValidity('');
    }
});
</script>
{% endblock %}
